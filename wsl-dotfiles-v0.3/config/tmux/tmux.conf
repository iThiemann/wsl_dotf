# ==============================================================================
# ~/.config/tmux/tmux.conf — managed by wsl-dotfiles
#
#   prefix = Ctrl-b  (alt: uncomment the C-Space block below)
#
#   ┌─ which-key ──────────────────────────────────────────────────────────────┐
#   │  prefix Space   which-key menu: grouped, press the letter to run it        │
#   │  prefix ?       fuzzy-search EVERY key binding (fzf popup)                 │
#   │  Alt-Space      which-key menu without the prefix                          │
#   └──────────────────────────────────────────────────────────────────────────┘
#
#   Sessions are saved every 10 min (tmux-continuum) and restored automatically
#   when the tmux server starts. Manual: prefix C-s save · prefix C-r restore.
#
#   Plugins (TPM): prefix I install · prefix U update · prefix M-u remove unused
#   Every binding below has a note (-N) → it shows up in prefix ? and list-keys -N.
# ==============================================================================

# --- prefix (alternative) ------------------------------------------------------------
# unbind C-b
# set -g prefix C-Space
# bind -N "Send the prefix key" C-Space send-prefix

# --- terminal / true colour (Windows Terminal supports RGB) ---------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g focus-events on
set -sg escape-time 10           # fast Esc for nvim
set -g extended-keys on          # pass modified keys (C-Enter, S-Tab …) to apps

# --- general ---------------------------------------------------------------------------
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g display-time 2000
set -g display-panes-time 2000
set -g set-clipboard on          # OSC 52 → Windows clipboard
set -g detach-on-destroy off     # closing the last window of a session → jump to another session
set -g allow-passthrough on      # images / OSC sequences from nvim plugins
setw -g aggressive-resize on
set -g set-titles on
set -g set-titles-string "#S · #W"

# --- core bindings (all annotated) -----------------------------------------------------
bind -N "Reload tmux.conf" r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

bind -N "Split pane side by side"        | split-window -h -c "#{pane_current_path}"
bind -N "Split pane top/bottom"          - split-window -v -c "#{pane_current_path}"
bind -N "Split pane top/bottom"          '"' split-window -v -c "#{pane_current_path}"
bind -N "Split pane side by side"        % split-window -h -c "#{pane_current_path}"
bind -N "New window in current dir"      c new-window -c "#{pane_current_path}"
bind -N "Kill pane"                      x kill-pane
bind -N "Kill window"                    X confirm-before -p "kill window #W? (y/n)" kill-window
bind -N "Rename window"                  , command-prompt -I "#W" { rename-window "%%" }
bind -N "Rename session"                 '$' command-prompt -I "#S" { rename-session "%%" }
bind -N "New session"                    N command-prompt -p "new session:" { new-session -s "%%" -c "#{pane_current_path}" }
bind -N "Toggle zoom of pane"            z resize-pane -Z
bind -N "Last window"                    Tab last-window
bind -N "Last session"                   BSpace switch-client -l
bind -N "Synchronise input to all panes" S setw synchronize-panes \; display "sync #{?synchronize-panes,ON,OFF}"
bind -N "Clear screen (C-l is taken by pane navigation)" C-l send-keys C-l

bind -N "Pane left"  h select-pane -L
bind -N "Pane down"  j select-pane -D
bind -N "Pane up"    k select-pane -U
bind -N "Pane right" l select-pane -R
bind -r -N "Resize pane left"  H resize-pane -L 5
bind -r -N "Resize pane down"  J resize-pane -D 5
bind -r -N "Resize pane up"    K resize-pane -U 5
bind -r -N "Resize pane right" L resize-pane -R 5
bind -r -N "Swap window left"  < swap-window -d -t -1
bind -r -N "Swap window right" > swap-window -d -t +1

bind -N "Popup: shell in current dir" t display-popup -E -w 80% -h 80% -d "#{pane_current_path}"
bind -N "Popup: lazygit"              g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind -N "IDE layout (3 panes below)"  i run-shell "tmux split-window -v -l 30% -c '#{pane_current_path}' && tmux split-window -h -l 66% -c '#{pane_current_path}' && tmux split-window -h -l 50% -c '#{pane_current_path}'"

# --- copy mode (vi keys; tmux-yank sends to the Windows clipboard) -----------------------
setw -g mode-keys vi
bind -N "Enter copy mode" Enter copy-mode
bind -T copy-mode-vi -N "Start selection"       v send -X begin-selection
bind -T copy-mode-vi -N "Rectangle selection"   C-v send -X rectangle-toggle
bind -T copy-mode-vi -N "Copy to clipboard"     y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi -N "Cancel"                Escape send -X cancel

# --- which-key ----------------------------------------------------------------------------
# Searchable list of every binding (prefix, root, copy-mode) in an fzf popup
bind -N "Search ALL key bindings (which-key list)" ? \
  display-popup -E -w 85% -h 85% -T " key bindings " "$HOME/.local/bin/tmux-keys"

# which-key menu: groups → press the highlighted letter (defined in which-key.tmux)
bind -N "which-key menu" Space source-file ~/.config/tmux/which-key.tmux
bind -n -N "which-key menu (no prefix)" M-Space source-file ~/.config/tmux/which-key.tmux

# --- status bar (Tokyo Night) -------------------------------------------------------------
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left-length 50
set -g status-right-length 80
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[bg=#1a1b26] "
set -g status-right "#{prefix_highlight} #[fg=#565f89]↻#{continuum_status}m  %a %d.%m. #[fg=#7aa2f7]%H:%M "
setw -g window-status-format "#[fg=#565f89] #I:#W "
setw -g window-status-current-format "#[fg=#bb9af7,bold] #I:#W#{?window_zoomed_flag, [Z],} "
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-lines heavy
set -g message-style "bg=#283457,fg=#c0caf5"
set -g mode-style "bg=#283457,fg=#c0caf5"
set -g popup-border-lines rounded
set -g popup-border-style "fg=#7aa2f7"
set -g menu-border-lines rounded
set -g menu-style "bg=#1a1b26,fg=#c0caf5"
set -g menu-selected-style "bg=#283457,fg=#7dcfff"
set -g menu-border-style "fg=#7aa2f7"

# ===========================================================================================
# Plugins (TPM) — installed headless by install.sh; inside tmux: prefix I
# ===========================================================================================
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.config/tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'

# ── must have ───────────────────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tmux-sensible'         # sane defaults everyone agrees on
set -g @plugin 'tmux-plugins/tmux-resurrect'        # save / restore sessions, windows, panes, cwd, programs
set -g @plugin 'tmux-plugins/tmux-continuum'        # automatic resurrect save + restore on tmux start
set -g @plugin 'omerxx/tmux-sessionx'               # session manager: fzf + zoxide + preview (prefix o)
set -g @plugin 'christoomey/vim-tmux-navigator'     # C-h/j/k/l across nvim splits AND tmux panes
set -g @plugin 'tmux-plugins/tmux-yank'             # copy to the system (Windows) clipboard

# ── need to have ──────────────────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tmux-prefix-highlight' # shows PREFIX / COPY / SYNC in the status bar
set -g @plugin 'wfxr/tmux-fzf-url'                  # prefix u: pick a URL from the pane, open it
set -g @plugin 'sainnhe/tmux-fzf'                   # prefix F: fzf over sessions/windows/panes/commands
set -g @plugin 'tmux-plugins/tmux-open'             # copy mode: o open selection, C-o open in $EDITOR

# --- resurrect: what gets saved ------------------------------------------------------------------
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'        # restore the scrollback you could see
set -g @resurrect-strategy-nvim 'session'           # reopen nvim with its Session.vim (:mksession / persistence.nvim)
# extra programs to restart (vim/nvim/less/man/htop/top/tail are in the defaults)
set -g @resurrect-processes 'ssh lazygit btop k9s watch'
set -g @resurrect-save 'C-s'                        # prefix C-s save now
set -g @resurrect-restore 'C-r'                     # prefix C-r restore

# --- continuum: auto save every 10 min, auto restore when the server starts ---------------------
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# --- sessionx ---------------------------------------------------------------------------------------
set -g @sessionx-bind 'o'
set -g @sessionx-zoxide-mode 'on'                   # also offer zoxide dirs → new session there
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '80%'
set -g @sessionx-filter-current 'false'
set -g @sessionx-preview-location 'right'

# --- yank / open / url -------------------------------------------------------------------------------
set -g @override_copy_command 'pbcopy'              # WSL: our UTF-8-safe pbcopy (clip.exe breaks umlauts)
set -g @yank_selection_mouse 'clipboard'
set -g @open 'o'
set -g @open-editor 'C-o'
set -g @fzf-url-bind 'u'
set -g @fzf-url-history-limit '2000'
set -g @fzf-url-open 'open'                         # our WSL `open` → Windows default browser

# --- prefix highlight --------------------------------------------------------------------------------
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_show_sync_mode 'on'
set -g @prefix_highlight_fg '#1a1b26'
set -g @prefix_highlight_bg '#e0af68'
set -g @prefix_highlight_copy_mode_attr 'fg=#1a1b26,bg=#9ece6a'
set -g @prefix_highlight_sync_mode_attr 'fg=#1a1b26,bg=#f7768e'

# keep this line at the very bottom
if-shell "test -x ~/.config/tmux/plugins/tpm/tpm" "run '~/.config/tmux/plugins/tpm/tpm'" \
  "display 'TPM missing — run ./install.sh (or git clone tpm into ~/.config/tmux/plugins/tpm)'"
