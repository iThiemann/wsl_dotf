"$schema" = 'https://starship.rs/config-schema.json'

# Two-line prompt, Tokyo Night colours (matches fzf / rg / tmux)
add_newline = true
command_timeout = 800
palette = "tokyonight"

format = """
$username$hostname$directory$git_branch$git_state$git_status\
$python$nodejs$golang$rust$java$terraform$docker_context$kubernetes\
$cmd_duration$jobs
$character"""

[palettes.tokyonight]
red    = "#f7768e"
orange = "#ff9e64"
yellow = "#e0af68"
green  = "#9ece6a"
cyan   = "#7dcfff"
blue   = "#7aa2f7"
purple = "#bb9af7"
fg     = "#c0caf5"
muted  = "#565f89"

[username]
show_always = false
style_user = "bold yellow"
format = "[$user]($style)@"

[hostname]
ssh_only = true
style = "bold green"
format = "[$hostname]($style) "

[directory]
style = "bold blue"
truncation_length = 4
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " ro"

[git_branch]
style = "purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "red"
format = '([$all_status$ahead_behind]($style) )'

[git_state]
style = "bold orange"

[cmd_duration]
min_time = 2000
style = "yellow"
format = "[took $duration]($style) "

[jobs]
style = "cyan"

[kubernetes]
disabled = false
style = "cyan"
format = '[$symbol$context( \($namespace\))]($style) '
# only show when a kube config/context is relevant
detect_files = ["kustomization.yaml", "Chart.yaml", "skaffold.yaml"]

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold green)"
