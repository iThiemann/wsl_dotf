# ~/.config/atuin/config.toml — full reference: https://docs.atuin.sh/configuration/config/

search_mode = "fuzzy"
filter_mode = "global"
# used if you ever enable atuin's own Up-arrow binding
filter_mode_shell_up_key_binding = "session"

style = "compact"
inline_height = 25
show_preview = true
show_help = true

# Enter runs the command, Tab puts it on the prompt for editing
enter_accept = true

update_check = false

# Keep secrets out of the history
secrets_filter = true
history_filter = [
  "^\\s",          # commands starting with a space
  "^(ls|ll|la|l|c|q|clear|exit)$",
]

# Sync with your Mac:  atuin register / atuin login, then  atuin sync
# auto_sync = true
# sync_frequency = "10m"
