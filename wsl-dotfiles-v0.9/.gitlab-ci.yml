# Builds the test container = full install + headless nvim language tests.
# Fails the pipeline if any language loses its LSP / formatter / linter / parser.
stages: [test]

nvim-devops:
  stage: test
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -f nvim/tests/Dockerfile -t nvim-devops-test .
  rules:
    - changes: [nvim/**/*, install.sh, shell/**/*, .gitlab-ci.yml]
  timeout: 1h
